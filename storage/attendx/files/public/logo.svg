<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162220" />
      <stop offset="100%" stop-color="#0b1311" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="2.5" />

  <!-- Biometric Scanner Ring / Aperture -->
  <circle cx="60" cy="60" r="38" fill="none" stroke="url(#emeraldGrad)" stroke-width="3.5" opacity="0.85" stroke-dasharray="8 4" />

  <!-- Inner Verification Aperture -->
  <path d="M 60 28 A 32 32 0 0 1 88 44 L 75 53 A 16 16 0 0 0 60 44 Z" fill="url(#emeraldGrad)" opacity="0.4" />
  <path d="M 92 60 A 32 32 0 0 1 76 88 L 68 75 A 16 16 0 0 0 76 60 Z" fill="url(#emeraldGrad)" opacity="0.4" />
  <path d="M 60 92 A 32 32 0 0 1 32 76 L 45 67 A 16 16 0 0 0 60 76 Z" fill="url(#emeraldGrad)" opacity="0.4" />
  <path d="M 28 60 A 32 32 0 0 1 44 32 L 52 45 A 16 16 0 0 0 44 60 Z" fill="url(#emeraldGrad)" opacity="0.4" />

  <!-- Interlocking Monogram 'A' and 'X' with Checkmark -->
  <!-- Letter A -->
  <path d="M 46 76 L 36 76 L 54 36 L 66 36 L 84 76 L 74 76 L 69 64 L 51 64 Z M 55 55 L 65 55 L 60 44 Z" fill="#ffffff" filter="url(#glow)" />

  <!-- Stylized Electric Cyan Checkmark/X Crossing Accent -->
  <path d="M 40 58 L 52 70 L 82 40" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
