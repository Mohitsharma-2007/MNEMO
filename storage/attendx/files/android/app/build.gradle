plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Release signing — keystore lives at the repository root (same key as the
// Capacitor builds so existing installs can upgrade in place).
def keystoreFile = rootProject.file("../attendx-release.keystore")
def keystorePath = keystoreFile.exists() ? keystoreFile : file("../../attendx-release.keystore")
def releaseSigning = null
if (keystorePath.exists()) {
    releaseSigning = {
        storeFile keystorePath
        storePassword 'attendx2026'
        keyAlias 'attendx'
        keyPassword 'attendx2026'
    }
}

android {
    namespace 'in.attendx.app'
    compileSdk 35

    defaultConfig {
        applicationId "in.attendx.app"
        minSdk 24
        targetSdk 35
        versionCode 20000
        versionName "2.0.0"
    }

    signingConfigs {
        if (releaseSigning != null) {
            release releaseSigning
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePath.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}